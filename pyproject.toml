[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "browserforge-stealth"
version = "1.3.0"
description = "Realistic and intelligent browser header & fingerprint generator for Patchright, Playwright, and anti-detect automation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "daijro" },
    { name = "CatDogFishFrog" }
]
dependencies = [
    "apify-fingerprint-datapoints>=0.1.0",
]

[project.optional-dependencies]
orjson = ["orjson>=3.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
browserforge-stealth = "browserforge_stealth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["browserforge", "browserforge_stealth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["browserforge_stealth", "browserforge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"browserforge/**" = ["E501", "F401", "F403", "B008", "UP006", "UP035", "SIM105", "RUF012"]
"tests/**" = ["E501", "RUF059"]

[tool.mypy]
python_version = "3.11"
packages = ["browserforge_stealth"]
ignore_missing_imports = true
warn_unreachable = true
