[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "browserforge-stealth"
version = "1.3.0"
description = "Realistic and intelligent browser header & fingerprint generator for Patchright, Playwright, and anti-detect automation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "daijro" },
    { name = "CatDogFishFrog" }
]
dependencies = [
    "apify-fingerprint-datapoints>=0.1.0",
]

[project.optional-dependencies]
orjson = ["orjson>=3.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
browserforge-stealth = "browserforge_stealth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["browserforge", "browserforge_stealth"]
